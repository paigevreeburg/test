<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Partline Topper Collection Reel</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      /* ---------- Title card ---------- */
      #title-card {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f3f8;
      }
      #title-card .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 0 90px;
        text-align: center;
      }
      #title-card .eyebrow {
        font-family: "Arimo", Arial, sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #759191;
      }
      #title-card .headline {
        font-family: "Gelasio", Georgia, serif;
        font-weight: 700;
        font-size: 68px;
        line-height: 1.18;
        color: #454740;
        max-width: 860px;
      }

      /* ---------- Footage stage: a plain (untimed) full-bleed container.
           Its two video children each carry their own data-start/data-duration
           and are timed clips in their own right; a timed wrapper around a
           timed <video> is rejected by lint (video_nested_in_timed_element).
           Background must stay transparent so it never paints over the title
           card, which shares the same absolute-inset stacking position. ---------- */
      .stage {
        position: absolute;
        inset: 0;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
      }
      .stage .bg-video {
        position: absolute;
        inset: -40px;
        width: calc(100% + 80px);
        height: calc(100% + 80px);
        object-fit: cover;
        filter: blur(55px) brightness(0.72) saturate(1.05);
        transform: scale(1.12);
      }
      .stage .fg-frame {
        position: absolute;
        left: 0;
        top: 656.25px;
        width: 1080px;
        height: 607.5px;
      }
      .stage .fg-video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      /* ---------- Overlay labels ---------- */
      .overlay-label {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 420px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      /* Light frost card (not a dark scrim): #454740 charcoal text cannot
         clear WCAG 3:1 against any dark background (its own luminance caps
         that ratio around 2.2:1 even on pure black) but reads cleanly
         against the brand's own frost tone, so the card reuses that color
         plus a lifted shadow to separate it from moving footage of any
         brightness. */
      .overlay-label .scrim {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding: 26px 34px;
        border-radius: 18px;
        background: rgba(240, 243, 248, 0.94);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        max-width: 860px;
      }
      .overlay-label .underline {
        width: 56px;
        height: 5px;
        border-radius: 3px;
        background: #759191;
      }
      .overlay-label .headline {
        font-family: "Gelasio", Georgia, serif;
        font-weight: 700;
        font-size: 44px;
        line-height: 1.22;
        color: #454740;
      }

      @font-face {
        font-family: "Arimo";
        font-weight: 400;
        font-style: normal;
        src: url("assets/fonts/Arimo-400.ttf") format("truetype");
      }
      @font-face {
        font-family: "Arimo";
        font-weight: 700;
        font-style: normal;
        src: url("assets/fonts/Arimo-700.ttf") format("truetype");
      }
      @font-face {
        font-family: "Gelasio";
        font-weight: 400;
        font-style: normal;
        src: url("assets/fonts/Gelasio-400.ttf") format("truetype");
      }
      @font-face {
        font-family: "Gelasio";
        font-weight: 700;
        font-style: normal;
        src: url("assets/fonts/Gelasio-700.ttf") format("truetype");
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="partline-topper"
      data-start="0"
      data-duration="186.75"
      data-width="1080"
      data-height="1920"
    >
      <!-- Title card: 0 - 2.75s -->
      <section id="title-card" class="clip" data-start="0" data-duration="2.75" data-track-index="0">
        <div class="stack">
          <div class="eyebrow">Live Zoom Recap</div>
          <div class="headline">Partline Topper Collection</div>
        </div>
      </section>

      <!-- Footage stage: 2.75 - 186.75s (full 184s source clip) -->
      <div class="stage">
        <video
          id="bg-video"
          class="bg-video"
          src="assets/video/partline-topper.mp4"
          data-start="2.75"
          data-duration="184"
          data-layout-allow-overflow
          muted
          playsinline
        ></video>
        <div class="fg-frame">
          <video
            id="fg-video"
            class="fg-video"
            src="assets/video/partline-topper.mp4"
            data-start="2.75"
            data-duration="184"
            muted
            playsinline
          ></video>
        </div>
      </div>

      <!-- Overlay labels, over the footage -->
      <div id="label-light-petite" class="overlay-label clip" data-start="2.75" data-duration="69" data-track-index="1">
        <div class="scrim">
          <div class="underline"></div>
          <div class="headline">Lite Petite</div>
        </div>
      </div>
      <div id="label-light-extended" class="overlay-label clip" data-start="71.75" data-duration="40" data-track-index="1">
        <div class="scrim">
          <div class="underline"></div>
          <div class="headline">Lite Extended</div>
        </div>
      </div>
      <div id="label-full-petite" class="overlay-label clip" data-start="111.75" data-duration="43" data-track-index="1">
        <div class="scrim">
          <div class="underline"></div>
          <div class="headline">Full Petite</div>
        </div>
      </div>
      <div id="label-compare" class="overlay-label clip" data-start="154.75" data-duration="32" data-track-index="1">
        <div class="scrim">
          <div class="underline"></div>
          <div class="headline">Lite Petite vs. Lite Extended</div>
        </div>
      </div>

      <!-- Audio: original room sound, starts once the footage begins -->
      <audio
        id="source-audio"
        src="assets/video/partline-topper.mp4"
        data-start="2.75"
        data-duration="184"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Title card fade in / hold / fade out
      tl.fromTo("#title-card", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);
      tl.to("#title-card", { opacity: 0, duration: 0.35, ease: "power1.in" }, 2.4);

      // Overlay label enter animations (small rise + fade, global time = each label's data-start)
      const labels = [
        { id: "#label-light-petite", t: 2.75 },
        { id: "#label-light-extended", t: 71.75 },
        { id: "#label-full-petite", t: 111.75 },
        { id: "#label-compare", t: 154.75 },
      ];
      labels.forEach(({ id, t }) => {
        tl.fromTo(
          `${id} .scrim`,
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          t,
        );
      });

      window.__timelines["partline-topper"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
